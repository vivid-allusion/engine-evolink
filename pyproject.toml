[project]
name = "engine-evolink"
version = "0.1.0"
description = "Engine wrapper for the Evolink.AI API. Uniform interface that studiolot Vehicles call instead of talking to the provider directly."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
packages = ["engine_evolink"]

[tool.setuptools.package-data]
engine_evolink = ["endpoints/**/*.toml", "endpoints/**/*.gitkeep", "profiles/standby/*.yaml"]
