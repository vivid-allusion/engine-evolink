id = "nanobanana-pro"
label = "Nano Banana Pro"
category = "IMG"
platform = "evolink"
endpoint = "gemini-3-pro-image-preview"
description = "Gemini 3 Pro Image preview. Flagship image generation and editing. Asynchronous task API; reference images via image_urls."

[params.size]
label = "Aspect Ratio"
type = "select"
default = "auto"
optional = true
options = [
  { value = "auto", label = "Auto" },
  { value = "1:1",  label = "1:1 · Square" },
  { value = "2:3",  label = "2:3 · Portrait" },
  { value = "3:2",  label = "3:2 · Landscape" },
  { value = "3:4",  label = "3:4 · Portrait" },
  { value = "4:3",  label = "4:3 · Classic" },
  { value = "4:5",  label = "4:5 · Portrait" },
  { value = "5:4",  label = "5:4 · Landscape" },
  { value = "9:16", label = "9:16 · Vertical" },
  { value = "16:9", label = "16:9 · Landscape · Standard" },
  { value = "21:9", label = "21:9 · Ultrawide · Cinematic" },
]

[params.quality]
label = "Quality"
type = "select"
default = "2K"
options = [
  { value = "1K", label = "1K · Standard" },
  { value = "2K", label = "2K · High Quality" },
  { value = "4K", label = "4K · Maximum" },
]

[params."model_params.web_search"]
label = "Web Search Grounding"
type = "boolean"
default = false
hidden = true
