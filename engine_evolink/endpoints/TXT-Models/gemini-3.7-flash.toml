id = "gemini-3.7-flash"
label = "Gemini 3.7 Flash"
category = "TXT"
platform = "evolink"
endpoint = "gemini-3.7-flash"
description = "Google Gemini 3.7 Flash via Evolink.AI. OpenAI-compatible chat completions (synchronous)."

[params.max_completion_tokens]
label = "Max Output Tokens"
type = "integer"
default = 2000

[params.temperature]
label = "Temperature"
type = "number"
default = 1.0

[params.top_p]
label = "Top P"
type = "number"
default = 0.95

[params.reasoning_effort]
label = "Reasoning Effort"
type = "select"
default = "minimal"
optional = true
options = [
  { value = "minimal", label = "Minimal" },
  { value = "low",     label = "Low" },
  { value = "medium",  label = "Medium" },
  { value = "high",    label = "High" },
]

[params.frequency_penalty]
label = "Frequency Penalty"
type = "number"
default = 0.0
hidden = true

[params.presence_penalty]
label = "Presence Penalty"
type = "number"
default = 0.0
hidden = true
