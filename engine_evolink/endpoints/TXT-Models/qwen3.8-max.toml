id = "qwen3.8-max"
label = "Qwen 3.8 Max"
category = "TXT"
platform = "evolink"
endpoint = "qwen3.8-max"
description = "Alibaba Qwen 3.8 Max. OpenAI-compatible chat completions with optional thinking mode (synchronous)."

